services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DASHBOARD_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:80"
